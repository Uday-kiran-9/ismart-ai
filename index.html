<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iSmart AI — Discover the Best AI Tools</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- AURORA BLOBS -->
  <div class="aurora aurora-1"></div>
  <div class="aurora aurora-2"></div>
  <div class="aurora aurora-3"></div>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">
      <span class="grad-text">iSmart</span><span style="color:#64748b">AI</span>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="search" placeholder="Search tools..." autocomplete="off" />
    </div>

    <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">
      <button class="fav-btn" onclick="toggleFavPanel()">
        ❤️ Saved <span id="fav-count">0</span>
      </button>
      <button class="theme-btn" onclick="toggleTheme()">☀️</button>
    </div>
  </nav>

  <!-- CATEGORY NAV -->
  <div class="cat-nav" id="categoryNav"></div>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-badge">✦ 38+ AI Tools Curated</div>
    <h2>
      Discover the Best<br>
      <span class="grad-text-shimmer">AI Tools</span> for Any Task
    </h2>
    <p>Compare, explore, and find the perfect AI — all in one place.</p>

    <div class="recommend-row">
      <div class="segment-control">
        <button class="segment-btn selected" data-val="coding" onclick="selectSegment(this)">💻 Coding</button>
        <button class="segment-btn" data-val="writing" onclick="selectSegment(this)">✍️ Writing</button>
        <button class="segment-btn" data-val="design" onclick="selectSegment(this)">🎨 Design</button>
      </div>
      <button class="recommend-btn" onclick="recommend()">✦ Get Recommendation</button>
    </div>

    <div class="stat-badges">
      <div class="stat-badge">🛠️ <span class="num">38+</span> Tools</div>
      <div class="stat-badge">📂 <span class="num">9</span> Categories</div>
      <div class="stat-badge">🆓 <span class="num">Free</span> & Paid</div>
      <div class="stat-badge">⚡ <span class="num">Live</span> Compare</div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results"></section>

  <!-- COMPARE -->
  <section class="compare-section">
    <div class="section-label">
      <h2>Compare Tools</h2>
      <div class="line"></div>
    </div>

    <div class="compare-controls">
      <select id="compare1" class="styled-select"></select>
      <div class="vs-badge">VS</div>
      <select id="compare2" class="styled-select"></select>
      <button class="compare-btn" onclick="compareTools()">⚡ Compare</button>
    </div>

    <div id="compareResult"></div>
  </section>

  <!-- TOOLS -->
  <section id="tools-section"></section>

  <!-- MODAL -->
  <div id="modal" onclick="handleModalClick(event)">
    <div class="modal-inner">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-cat" id="modalCat"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
      <div class="modal-ratings" id="modalRatings"></div>
      <a id="modalLink" href="#" target="_blank" class="modal-link-btn">Visit Tool →</a>
    </div>
  </div>

  <!-- FAVORITES PANEL -->
  <div id="favPanel">
    <div class="fav-header">
      <h2>❤️ Saved Tools</h2>
      <button class="modal-close" onclick="toggleFavPanel()" style="position:static;">✕</button>
    </div>
    <div id="favList"></div>
  </div>

  <!-- TOAST -->
  <div id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
